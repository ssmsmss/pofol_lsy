<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>포트폴리오</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 흰 큰 카드 -->
  <div class="sheet">

    <!-- 왼쪽: ABOUT ME -->
    <aside class="about">
      <h3 class="small-label">ABOUT ME</h3>

      <div class="photo" id="photo">
        <!-- 사진이 없을 때 보이는 회색 자리 표시 -->
        <svg class="photo-empty" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4" />
          <path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" />
        </svg>
      </div>

      <h1 class="name" id="name"></h1>
      <p class="job-title" id="title"></p>
      <div class="badge" id="badge"></div>

      <ul class="contacts">
        <li>
          <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" /></svg>
          </span>
          <div>
            <div class="contact-label">이름</div>
            <div class="contact-value" id="contactName"></div>
          </div>
        </li>
        <li>
          <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18v14H3z" /><path d="M3 6l9 7 9-7" fill="none" stroke="#0f172a" stroke-width="2" /></svg>
          </span>
          <div>
            <div class="contact-label">이메일</div>
            <a class="contact-value" id="contactEmail"></a>
          </div>
        </li>
        <li>
          <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z" /></svg>
          </span>
          <div>
            <div class="contact-label">연락처</div>
            <div class="contact-value" id="contactPhone"></div>
          </div>
        </li>
        <li>
          <span class="icon">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z" /></svg>
          </span>
          <div>
            <div class="contact-label">위치</div>
            <div class="contact-value" id="contactLocation"></div>
          </div>
        </li>
      </ul>
    </aside>

    <!-- 오른쪽: PORTFOLIO -->
    <main class="content">
      <div>
        <div class="big-title">
          <span class="bar"></span>
          <h2>PORTFOLIO</h2>
        </div>
        <h3 class="headline" id="headline"></h3>
        <p class="intro" id="intro"></p>

        <!-- 세 칸 -->
        <div class="info-grid">
          <div class="info-box">
            <div class="info-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 1 9l11 6 9-4.9V17h2V9z" /><path d="M5 13.2V17c0 1.7 3.1 3 7 3s7-1.3 7-3v-3.8l-7 3.8z" /></svg>
              <span>EDUCATION</span>
            </div>
            <div class="info-lines" id="education"></div>
          </div>
          <div class="info-box">
            <div class="info-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z" /></svg>
              <span>SKILLS &amp; TOOLS</span>
            </div>
            <ul class="skills" id="skills"></ul>
          </div>
          <div class="info-box">
            <div class="info-title">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6a2 2 0 0 1 2 2v2h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3V5a2 2 0 0 1 2-2zm0 4h6V5H9z" /></svg>
              <span>EXPERIENCE</span>
            </div>
            <div class="info-lines" id="experience"></div>
          </div>
        </div>
      </div>

      <!-- PORTFOLIO HIGHLIGHTS -->
      <section class="highlights">
        <div class="highlights-head">
          <h4 class="small-label dark">PORTFOLIO HIGHLIGHTS</h4>
          <span class="hint">(카드를 누르면 자세한 자료를 새 탭에서 볼 수 있습니다)</span>
        </div>
        <div class="cards" id="cards"></div>
      </section>

      <p class="quote" id="quote"></p>
    </main>
  </div>

  <!-- 방명록 상자 -->
  <section class="sheet guestbook">
    <div class="big-title">
      <span class="bar"></span>
      <h2>GUESTBOOK</h2>
    </div>
    <p class="intro">편하게 한마디 남겨 주세요.</p>

    <div class="gb-form">
      <input id="gbNickname" type="text" maxlength="20" placeholder="별명 (20자까지)" />
      <input id="gbMessage" type="text" maxlength="200" placeholder="한마디 (200자까지)" />
      <button type="button" id="gbSubmit">남기기</button>
    </div>
    <p class="gb-status" id="gbStatus"></p>

    <ul class="gb-list" id="gbList"></ul>
  </section>

  <p class="load-error" id="loadError" hidden>내용을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.</p>

  <script src="script.js"></script>
</body>
</html>
